[project]
name = "cuno"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ArnabHira03", email = "myarnab03@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cuno = "cuno:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
